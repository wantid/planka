services:
  planka:
    image: ghcr.io/wantid/planka:latest
    container_name: planka
    restart: on-failure
    volumes:
      - data:/app/data
    environment:
      - BASE_URL=https://tasks.exers.net
      - DATABASE_URL=postgresql://postgres@postgres/planka
      - SECRET_KEY=CHANGE_ME_USE_openssl_rand_hex_64
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - npm_default
      - default

  postgres:
    image: postgres:16-alpine
    container_name: planka_postgres
    restart: on-failure
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=planka
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

volumes:
  data:
  db-data:

networks:
  npm_default:
    external: true
  default:
    driver: bridge
